[project]
name = "agentmemos"
version = "0.1.0"
description = "Event-driven scoped memory service for multi-agent workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]
redis = [
    "redis>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
