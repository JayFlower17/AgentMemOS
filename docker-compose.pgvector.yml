services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: agentmemos-pgvector
    environment:
      POSTGRES_USER: agentmemos
      POSTGRES_PASSWORD: agentmemos
      POSTGRES_DB: agentmemos
    ports:
      - "5432:5432"
    volumes:
      - agentmemos-pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmemos -d agentmemos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agentmemos-pgvector-data:
